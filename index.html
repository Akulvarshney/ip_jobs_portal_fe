<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resolve - Insolvency Professionals Portal</title>
    <script>
      // Restore the cached preference before the first paint; /auth/me refreshes it.
      try {
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        const preference = localStorage.getItem('token')
          ? user?.theme
          : localStorage.getItem('portalGuestTheme');
        document.documentElement.dataset.theme = preference === 'light' ? 'light' : 'dark';
        document.documentElement.style.colorScheme = document.documentElement.dataset.theme;
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
