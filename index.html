<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/src/assets/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resolve - Insolvency Professionals Portal</title>
  <script>

    const istHour = new Date(Date.now() + 5.5 * 60 * 60 * 1000).getUTCHours();
    const loggedOutTheme = istHour >= 6 && istHour < 18 ? 'light' : 'dark';
    let preference = loggedOutTheme;
    try {
      if (localStorage.getItem('token')) {
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        preference = user?.theme === 'light' ? 'light' : 'dark';
      }
    } catch { /* Use the IST theme when browser storage is unavailable. */ }
    document.documentElement.dataset.theme = preference;
    document.documentElement.style.colorScheme = preference;
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
